<!doctype html>
<html lang="en"><body>
  <input id="search" type="search" aria-label="Search">
  <textarea id="textarea-en" aria-label="Add a comment..."></textarea>
  <textarea id="textarea-es" placeholder="Añade un comentario..."></textarea>
  <input id="input-comment" type="text" aria-label="Add a comment">
  <div id="rich-editor" role="textbox" contenteditable="true" aria-placeholder="Write a comment"></div>
  <div id="readonly-editor" role="textbox" contenteditable="false" aria-label="Add a comment"></div>
  <textarea id="hidden-editor" aria-label="Add a comment" style="display:none"></textarea>
  <textarea id="disabled-editor" aria-label="Add a comment" disabled></textarea>
  <textarea id="readonly-textarea" aria-label="Add a comment" readonly></textarea>
</body></html>
