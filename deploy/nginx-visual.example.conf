# Reference only. Merge into the existing Instagram Bot server blocks after
# inspecting `nginx -T`; do not add a second competing server for this IP.
# Certificate paths require a trusted certificate valid for 88.198.136.72.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name 88.198.136.72;
    # Keep the ACME webroot challenge location if IP certificate renewal uses it.
    location /.well-known/acme-challenge/ { root /var/www/instagram-bot-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name 88.198.136.72;
    ssl_certificate /etc/letsencrypt/live/88.198.136.72/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/88.198.136.72/privkey.pem;

    auth_basic "Instagram Bot - Acceso privado";
    auth_basic_user_file /etc/nginx/.instagram-bot-users;

    # WebSocket browsers can omit cached Basic credentials in the upgrade.
    # This single route is guarded by FastAPI's short-lived admin cookie,
    # CSRF subprotocol and strict Origin check. All other routes retain Basic.
    location ~ ^/api/accounts/[0-9]+/session/ws$ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1200s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1200s;
        proxy_buffering off;
    }
}
